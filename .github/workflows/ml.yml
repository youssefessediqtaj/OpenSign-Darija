name: ml

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ml/requirements-train.txt
      - run: python -m pytest ml/tests
      - run: ruff check ml
      - run: python -m compileall -q ml scripts
